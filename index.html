<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Бидний Музей</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Музей</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D world; glass HUD pinned to safe edges; contextual action bar above chat; lobby as a centered entry card. Single dark look by choice. */
:root{
  --ink:#0e1020;
  --glass:rgba(16,18,34,.80);
  --glass-2:rgba(30,32,54,.88);
  --paper:#f3ebe3;
  --muted:#b9b0c4;
  --rose:#e88aa0;
  --gold:#d9b76c;
  --line:rgba(243,235,227,.16);
  --f-display:"Prata","Georgia","Times New Roman",serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:14px;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;touch-action:none}
#scene canvas{display:block;width:100%;height:100%;cursor:grab}
#scene canvas:active{cursor:grabbing}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- Lobby ---------- */
#lobby{position:fixed;inset:0;display:grid;place-items:center;overflow:auto;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(14,16,32,.35),rgba(14,16,32,.82) 70%)}
.card{width:100%;max-width:440px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:26px 22px;display:grid;gap:16px;backdrop-filter:blur(10px)}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,7vw,40px);line-height:1.08;margin:0;text-wrap:balance;text-align:center}
.lede{margin:0;color:var(--muted);line-height:1.55}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.input{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .input{flex:1}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--paper);box-shadow:0 0 0 2px var(--ink) inset}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:8px;padding:9px}
.seg button[aria-pressed="true"]{border-color:var(--rose);color:var(--rose);background:rgba(232,138,160,.1)}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:8px;padding:10px 14px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:var(--rose);color:#2a0f18;border-color:transparent;font-weight:700;padding:13px 16px;font-size:15px}
.btn.primary:hover{background:#f19cb0}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55;margin:0}
.hint b{color:var(--paper);font-weight:600}
.keys{border-top:1px solid var(--line);padding-top:14px}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.char{border:2px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04);padding:10px 8px;display:grid;gap:6px;justify-items:center;min-width:0}
.char img{width:100%;max-width:150px;aspect-ratio:200/260;object-fit:contain}
.char span{font-family:var(--f-display);font-size:18px}
.char[aria-pressed="true"]{border-color:var(--rose);background:rgba(232,138,160,.14)}
.char:hover{background:rgba(255,255,255,.08)}
.foot{font-size:11px;color:var(--muted);margin:0;line-height:1.5}

/* ---------- HUD ---------- */
.top{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top > *{pointer-events:auto}
.status{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:grid;gap:3px;min-width:0;max-width:48vw}
.status .code{font-family:var(--f-display);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status .sub{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#777;display:inline-block}
.dot.on{background:#6fd49a}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tbtn{background:var(--glass);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12.5px}
.tbtn:hover{background:var(--glass-2)}
.tbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
#map{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));background:var(--glass);border:1px solid var(--line);border-radius:10px;width:140px;height:195px}
.together{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));background:rgba(232,138,160,.92);color:#2a0f18;font-weight:700;border-radius:999px;padding:6px 14px;font-size:12.5px;white-space:nowrap}
.toast{position:fixed;left:50%;top:calc(104px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--glass-2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;max-width:calc(100vw - 32px);text-align:center}
.req{position:fixed;left:50%;transform:translateX(-50%);top:calc(150px + env(safe-area-inset-top,0px));background:var(--glass-2);border:1px solid var(--rose);border-radius:12px;padding:12px 14px;display:grid;gap:10px;width:min(340px,calc(100vw - 32px));text-align:center}
.req .row{justify-content:center}
.req .btn.primary{padding:9px 14px;font-size:14px}

.info{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(126px + env(safe-area-inset-bottom,0px));width:min(470px,calc(100vw - 32px));
  background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:15px 18px;display:grid;gap:7px;backdrop-filter:blur(8px)}
.info .room{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.info h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;line-height:1.15}
.info .meta{font-size:12.5px;color:var(--muted)}
.info .where{font-size:12px;color:var(--gold)}
.info p{margin:0;line-height:1.5;font-size:13.5px}
.info .q{border-top:1px solid var(--line);padding-top:9px;display:grid;gap:3px}
.info .q span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--rose)}
.info .q div{font-family:var(--f-display);font-size:16px;line-height:1.35}
.info .x{position:absolute;top:6px;right:8px;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:20px;line-height:1}
.info .x:hover{background:rgba(255,255,255,.1);color:var(--paper)}
.info h2{padding-right:26px}
.info .pact{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.info .pact .btn.primary{padding:10px 14px;font-size:14px}

.actions{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;pointer-events:none;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.actions button{pointer-events:auto;background:var(--glass-2);border:1px solid var(--gold);color:var(--paper);border-radius:999px;padding:9px 16px;font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center}
.actions button:hover{background:rgba(217,183,108,.22)}
.actions kbd{font-family:var(--f-body);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.actions button:disabled{opacity:.6;cursor:default;border-color:var(--line)}

.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.bottom > *{pointer-events:auto}
.chatbox{display:flex;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:5px;flex:1;max-width:420px;min-width:0}
.chatbox input{flex:1;min-width:0;background:transparent;border:0;padding:8px 8px;outline:none}
.chatbox button{background:var(--rose);border:0;border-radius:7px;color:#2a0f18;font-weight:700;padding:7px 12px}
.emotes{display:flex;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:4px}
.emotes button{background:transparent;border:0;font-size:20px;width:38px;height:38px;border-radius:7px}
.emotes button:hover{background:rgba(255,255,255,.1)}
.log{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));width:min(290px,30vw);display:grid;gap:4px;pointer-events:none}
.log div{background:rgba(16,18,34,.66);border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.35;overflow-wrap:anywhere}

#joy{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border-radius:50%;
  background:rgba(16,18,34,.45);border:1px solid var(--line);display:none;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(243,235,227,.35)}

@media (pointer:coarse){ #joy{display:block} .jump{display:block} }
.fps{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(64px + env(safe-area-inset-top,0px));background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.jump{display:none;position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(130px + env(safe-area-inset-bottom,0px));width:72px;height:72px;border-radius:50%;border:1px solid var(--gold);background:rgba(16,18,34,.6);color:var(--paper);font-weight:700;touch-action:none}
@media (max-width:700px){
  #map{width:86px;height:120px;top:calc(60px + env(safe-area-inset-top,0px))}
  .info{bottom:calc(112px + env(safe-area-inset-bottom,0px));padding:11px 14px;max-height:50vh;overflow:auto}
  .info h2{font-size:18px}
  .info p{display:none}
  .log{display:none}
  .tbtn .lbl-long{display:none}
  .emotes button{width:34px;height:34px;font-size:18px}
  .actions{justify-content:flex-end}
  .actions kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="scene"></div>

<section id="lobby" aria-labelledby="ttl">
  <form class="card" id="lobbyForm" autocomplete="off">
    <h1 id="ttl">Бидний Музей</h1>
    <div class="chars" role="group" aria-label="Дүр сонгох">
      <button type="button" class="char" data-c="barkhas" aria-pressed="false"><img id="pv-barkhas" alt=""><span>Бархас</span></button>
      <button type="button" class="char" data-c="bolormaa" aria-pressed="false"><img id="pv-bolormaa" alt=""><span>Болормаа</span></button>
    </div>
    <button class="btn primary" type="submit">Нэвтрэх</button>
  </form>
</section>

<div id="hud" hidden>
  <div class="top">
    <div class="status">
      <div class="code" id="hudCode">—</div>
      <div class="sub" hidden><span class="dot" id="connDot"></span><span id="connTxt">Холбогдож байна…</span></div>
      <div class="sub" id="seenTxt" hidden>Хамт үзсэн: 0</div>
    </div>
    <div class="tools">
      <button class="tbtn" id="goPartner">♥ <span class="lbl-long">Хамтрагч руу очих</span></button>
      <button class="tbtn" id="camBtn">◎ <span class="lbl-long" id="camLbl">3-р этгээд</span></button>
      <button class="tbtn" id="lightBtn" aria-pressed="true">☀ <span class="lbl-long">Гэрэл</span></button>
      <button class="tbtn" id="musicBtn" aria-pressed="false">♪ <span class="lbl-long">Хөгжим</span></button>
      <button class="tbtn" id="leaveBtn">Гарах</button>
    </div>
  </div>
  <canvas id="map" width="280" height="390" aria-label="Газрын зураг"></canvas>
  <div class="together" id="together" hidden>Хоёулаа хамт үзэж байна</div>
  <div class="toast" id="toast" hidden></div>
  <div class="req" id="req" hidden>
    <div id="reqTxt"></div>
    <div class="row"><button class="btn primary" id="reqYes">Зөвшөөрөх</button><button class="btn" id="reqNo">Татгалзах</button></div>
  </div>

  <article class="info" id="info" hidden>
    <div class="room" id="infoRoom"></div>
    <button type="button" class="x" id="infoX" aria-label="Хаах">×</button>
    <h2 id="infoTitle"></h2>
    <div class="meta" id="infoMeta"></div>
    <div class="where" id="infoWhere"></div>
    <p id="infoDesc"></p>
    <div class="q" id="infoQBox"><span>Хоёулаа ярилцах асуулт</span><div id="infoQ"></div></div>
    <div class="pact" id="photoAct" hidden>
      <button type="button" class="btn primary" id="photoBtn">Зураг оруулах</button>
      <div class="row"><input class="input" id="capIn" maxlength="60" placeholder="Тайлбар" aria-label="Зургийн тайлбар"><button type="button" class="btn" id="capBtn">Хадгалах</button></div>
    </div>
  </article>
  <input type="file" id="photoIn" accept="image/*" hidden>

  <div class="log" id="log" aria-live="polite"></div>
  <div id="joy" aria-hidden="true"><i id="knob"></i></div>
  <div class="actions" id="actions"></div>
  <div class="fps" id="fps" hidden></div>
  <button class="jump" id="jumpBtn" type="button">Үсрэх</button>

  <div class="bottom">
    <form class="chatbox" id="chatForm">
      <input id="chatIn" maxlength="120" placeholder="Мессеж бичих…" aria-label="Мессеж">
      <button type="submit">Илгээх</button>
    </form>
    <div class="emotes" role="group" aria-label="Сэтгэгдэл илгээх">
      <button type="button" data-e="❤️" aria-label="Зүрх">❤️</button>
      <button type="button" data-e="😘" aria-label="Үнсэлт">😘</button>
      <button type="button" data-e="😂" aria-label="Инээх">😂</button>
      <button type="button" data-e="😮" aria-label="Гайхах">😮</button>
      <button type="button" data-e="👋" aria-label="Даллах">👋</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
(function(){
"use strict";
const TAU=Math.PI*2, PI=Math.PI, $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  desc:"Хөвсгөл нуурын шөнө. Сарны гэрэл усан дээр зам мэт сунаж, эрэгт хүрч ирдэг.",
  q:"Хамгийн сүүлд хамтдаа юу ярихдаа цаг мартсан бэ?",

   for(let y=H*.57;y<H;y+=5){const t=(y-H*.57)/(H*.43),w=10+(1-t)*20+t*90*r();c.fillStyle="rgba(255,236,190,"+(.6*(1-t*.7))+")";c.fillRect(mx-w/2+(r()-.5)*12*t,y,w,2)}}},
 {id:"sunset",room:"Тэнгэр ба газар",title:"Тал нутгийн үдэш",artist:"А.Бархас",year:"2018",medium:"Цаас, усан будаг",w:2.6,h:1.6,

const ON_CLAUDE=!!(window.claude&&window.claude.use);
const P2P_NS="bidnii-muzei-7k3q9x2m";
const PeerLink={peer:null,conn:null,me:"",other:"",ls:{},retry:null,wait:4000,
  on(t,f){(this.ls[t]=this.ls[t]||[]).push(f)},emit(t,d){(this.ls[t]||[]).forEach(f=>{try{f(d)}catch(e){}})},
  isOpen(){return !!(this.conn&&this.conn.open)},
  send(msg){if(this.isOpen())try{this.conn.send(msg)}catch(e){}},
  start(myChar){if(!window.Peer)return false;this.stop();const other=myChar==="barkhas"?"bolormaa":"barkhas";this.me=myChar;this.other=other;
    const p=this.peer=new Peer(P2P_NS+"-"+myChar,{debug:0});
    p.on("open",()=>{if(this.me<this.other)this.dial();else setTimeout(()=>{if(!this.isOpen()&&this.peer===p&&p.open)this.attach(p.connect(P2P_NS+"-"+this.other,{reliable:true}))},1500)});
    p.on("connection",c=>this.attach(c));this.wait=4000;
    p.on("disconnected",()=>{if(this.peer===p&&!p.destroyed)try{p.reconnect()}catch(e){}});
    p.on("error",e=>{if(e&&e.type==="unavailable-id")this.emit("status","taken")});
    return true},
  dial(){clearTimeout(this.retry);if(!this.peer||this.peer.destroyed)return;
    if(!this.isOpen()){if(this.conn){const old=this.conn;this.conn=null;try{old.close()}catch(e){}}if(this.peer.open)this.attach(this.peer.connect(P2P_NS+"-"+this.other,{reliable:true}))}
    this.retry=setTimeout(()=>this.dial(),this.wait);this.wait=Math.min(30000,this.wait*1.6)},
  attach(c){if(!c)return;if(this.isOpen()&&this.conn!==c){try{c.close()}catch(e){}return}this.conn=c;
    c.on("open",()=>{if(this.conn===c){this.wait=4000;this.emit("open")}});c.on("data",d=>this.emit("data",d));
    c.on("close",()=>{if(this.conn===c){this.conn=null;this.emit("close");if(this.me<this.other)this.dial()}});c.on("error",()=>{})},
  stop(){clearTimeout(this.retry);const c=this.conn,p=this.peer;this.conn=null;this.peer=null;try{c&&c.close()}catch(e){}try{p&&p.destroy()}catch(e){}}};
PeerLink.on("status",s=>{if(s==="taken")toast("Энэ дүрээр өөр цонхонд аль хэдийн орсон байна. Нөгөө цонхоо хаагаад дахин нэвтэрнэ үү.",6000)});

// the same small surface the claude.ai room offers, so the rest of the game does not care which one it talks to
const peerRoom=(function(){let myPres={},partner=null;const cbs=[],ccbs=[];
  const peers=()=>{const a=[{peer:profile.sex,sameTab:true,isMe:true,kind:"viewer",presence:myPres}];if(partner)a.push({peer:partner.ch,sameTab:false,isMe:false,kind:"viewer",presence:partner.pres});return a};
  const fire=()=>{const list=peers();cbs.forEach(f=>f({peers:list}))};
  const merge=(o,patch)=>{Object.keys(patch||{}).forEach(k=>{if(patch[k]===null)delete o[k];else o[k]=patch[k]})};
  PeerLink.on("open",()=>{PeerLink.send({t:"hello",ch:profile.sex,pres:myPres});ccbs.forEach(f=>f(true));fire();photoLocal.sync()});
  PeerLink.on("close",()=>{partner=null;ccbs.forEach(f=>f(false));fire()});
  PeerLink.on("data",d=>{if(!d||typeof d!=="object")return;
    if(d.t==="hello"){partner={ch:charId(d.ch),pres:{}};merge(partner.pres,d.pres);fire()}
    else if(d.t==="p"&&partner){merge(partner.pres,d.patch);fire()}});
  return{reset(){myPres={};partner=null},
    presence(patch){merge(myPres,patch);PeerLink.send({t:"p",patch});return Promise.resolve()},
    onPeers(f){cbs.push(f);setTimeout(fire,0);return()=>{}},
    onConnection(f){ccbs.push(f);setTimeout(()=>f(PeerLink.isOpen()),0);return()=>{}},
    connected(){return PeerLink.isOpen()},
    leave(){PeerLink.stop();partner=null;cbs.length=0;ccbs.length=0;return Promise.resolve()}}})();

const photoLocal={docs:(()=>{const d=store.get("md.photos",{});return d&&typeof d==="object"?d:{}})(),subs:[],
  snap(){return{docs:Object.entries(this.docs).map(([id,v])=>({id,data:()=>v}))}},
  emitAll(){const s=this.snap();this.subs.forEach(f=>f(s))},
  put(id,v,fromPeer){if(!/^p[1-8]$/.test(id)||!v||typeof v!=="object")return true;const cur=this.docs[id];if(fromPeer&&cur&&(cur.t||0)>=(v.t||0))return true;
    this.docs[id]={img:typeof v.img==="string"?v.img:"",cap:typeof v.cap==="string"?v.cap.slice(0,60):"",by:typeof v.by==="string"?v.by.slice(0,20):"",t:+v.t||Date.now()};
    let ok=true;try{localStorage.setItem("md.photos",JSON.stringify(this.docs))}catch(e){ok=false}
    this.emitAll();if(!fromPeer)PeerLink.send({t:"photo",id,v:this.docs[id]});return ok},
  sync(){Object.entries(this.docs).forEach(([id,v])=>PeerLink.send({t:"photo",id,v}))},
  db(){const self=this;return{doc(path){const id=String(path).split("/")[1];return{set(v){if(self.put(id,v))return Promise.resolve();const e=new Error("full");e.code="quota_exceeded";return Promise.reject(e)}}},
    collection(){return{onSnapshot(f){self.subs.push(f);setTimeout(()=>f(self.snap()),0);return()=>{}}}}}}};

async function enter(snap){
  entered=true;$("lobby").hidden=true;$("hud").hidden=false;$("hudCode").textContent="Бархас ♥ Болормаа";
  seen=new Set(store.get("md.seen."+profile.code,[]));updSeen();

  if(snap&&Number.isFinite(snap.x)){me.x=snap.x;me.z=snap.z;me.yaw=me.camYaw=snap.yaw||0}else{me.x=(Math.random()-.5)*3;me.z=16.5;me.yaw=me.camYaw=0;me.pitch=-.25}
  me.sit=null;me.hk=0;myLink=null;myReq=null;

  if(!entered){named.leave().catch(()=>{});named=null;return}
  named.onConnection(ok=>setConn(ok),()=>setConn(false,"Ганцаараа горим"));
  named.onPeers(ch=>syncPeers(ch.peers),()=>{});
  pres({n:profile.name,c:profile.color,s:profile.sex,x:r2(me.x),z:r2(me.z),y:r2(me.yaw),a:null,p:null,hk:0});

const POSES=["sit","hug","kiss","hand-r","hand-l","jump"];
function safeName(v){return typeof v==="string"&&v.trim()?v.trim().slice(0,20):"Зочин"}
function safeColor(v){return typeof v==="string"&&/^#[0-9a-f]{6}$/i.test(v)?v:"#cccccc"}
function syncPeers(list){
  const live=new Set();
  for(const p of list){if(p.sameTab){myPeer=p.peer;continue}if(p.kind!=="viewer")continue;const pr=p.presence||{};if(!Number.isFinite(pr.x)||!Number.isFinite(pr.z))continue;live.add(p.peer);
    let o=others.get(p.peer);const name=safeName(pr.n),color=safeColor(pr.c),sex=charId(pr.s);
    if(!o){o={peer:p.peer,name,color,sex,av:makeAvatar({color,sex}),tx:pr.x,tz:pr.z,ty:pr.y||0,x:pr.x,z:pr.z,y:pr.y||0,lastM:pr.m&&pr.m.id,lastE:pr.e&&pr.e.id,bubble:null,bubbleUntil:0,label:null,speed:0};
      o.label=nameSprite(name,color);o.label.position.y=2.35;o.av.g.add(o.label);others.set(p.peer,o);toast(name+" орж ирлээ",3000);addLog(null,name+" орж ирлээ")}
    if(o.name!==name||o.color!==color||o.sex!==sex){scene.remove(o.av.g);o.name=name;o.color=color;o.sex=sex;o.av=makeAvatar({color,sex});o.label=nameSprite(name,color);o.label.position.y=2.35;o.av.g.add(o.label);if(o.bubble){o.av.g.add(o.bubble)}}
    o.tx=pr.x;o.tz=pr.z;o.th=Number.isFinite(pr.h)?Math.max(0,Math.min(3,pr.h)):0;o.ty=Number.isFinite(pr.y)?pr.y:o.ty;o.a=typeof pr.a==="string"?pr.a:null;o.p=POSES.includes(pr.p)?pr.p:null;o.hk=Number.isFinite(pr.hk)?Math.max(0,Math.min(4,pr.hk)):0;
    o.lk=pr.lk&&typeof pr.lk==="object"?pr.lk:null;o.rq=pr.rq&&typeof pr.rq==="object"?pr.rq:null;o.ac=pr.ac&&typeof pr.ac==="object"?pr.ac:null;
    if(pr.m&&typeof pr.m.t==="string"&&pr.m.id!==o.lastM){o.lastM=pr.m.id;const t=pr.m.t.slice(0,120);showBubble(o,t);addLog(o,t)}
    if(pr.e&&typeof pr.e.k==="string"&&pr.e.id!==o.lastE){o.lastE=pr.e.id;if(EMOJI.includes(pr.e.k))floatEmoji(pr.e.k,o.x,2.3,o.z)}
    // incoming request
    if(o.rq&&o.rq.to===myPeer&&typeof o.rq.id==="string"&&!handledReq.has(o.rq.id)&&(o.rq.k==="hand"||o.rq.k==="hug"||o.rq.k==="kiss")){if(!incoming||incoming.id!==o.rq.id){incoming={id:o.rq.id,k:o.rq.k,from:p.peer,name};showReq()}}
    if(incoming&&incoming.from===p.peer&&(!o.rq||o.rq.id!==incoming.id)){incoming=null;$("req").hidden=true}
    // answer to my request
    if(myReq&&o.peer===myReq.to&&o.ac&&o.ac.id===myReq.id){const r=myReq;myReq=null;pres({rq:null});
      if(o.ac.ok){myLink={k:r.k,w:o.peer,id:r.id,lead:true,t:performance.now()};pres({lk:{k:r.k,w:o.peer,id:r.id}});startLinkFx()}else toast(name+" одоохондоо татгалзлаа.")}
  }
  for(const [id,o] of others)if(!live.has(id)){scene.remove(o.av.g);others.delete(id);addLog(null,o.name+" гарлаа");if(incoming&&incoming.from===id){incoming=null;$("req").hidden=true}}
  if(named&&named.connected())setConn(true);
}
function showBubble(o,t){if(o.bubble)o.av.g.remove(o.bubble);o.bubble=bubbleSprite(t);o.bubble.position.y=2.55+o.bubble.scale.y/2;o.av.g.add(o.bubble);o.bubbleUntil=performance.now()+7000}

/* ================= Actions: sit, hand, hug, eat ================= */
const ACT_TXT={hand:"хөтлөлцөх",hug:"тэврэх",kiss:"үнсэх"};
function nearestOther(maxD){let best=null,bd=maxD;for(const o of others.values()){const d=Math.hypot(o.tx-me.x,o.tz-me.z);if(d<bd){bd=d;best=o}}return best}
function freeSeat(){let best=null,bd=1.9;for(const s of seats){const d=Math.hypot(s.x-me.x,s.z-me.z);if(d>=bd)continue;let taken=false;for(const o of others.values())if(o.p==="sit"&&Math.hypot(o.x-s.x,o.z-s.z)<.3)taken=true;if(!taken){bd=d;best=s}}return best}
function standUp(){if(!me.sit)return;const s=me.sit;me.sit=null;const fx=s.x-Math.sin(s.yaw)*.8,fz=s.z-Math.cos(s.yaw)*.8;if(!collides(fx,fz)){me.x=fx;me.z=fz}}
function doAction(k){if(!entered)return;
  if(k==="sit"){if(me.sit){standUp();return}if(myLink&&myLink.k!=="hand"&&!myLink.lead)return;const s=freeSeat();if(!s){toast("Ойролцоо сул суудал алга. Вандан сандал руу ойртоорой.");return}if(myLink&&myLink.k!=="hand")endLink();me.sit=s;me.x=s.x;me.z=s.z;me.yaw=me.camYaw=s.yaw;return}
  if(k==="unlink"){endLink();return}
  if(k==="hand"||k==="hug"||k==="kiss"){if(myLink){endLink();return}const o=nearestOther(3);if(!o){toast(others.size?"Хамтрагчдаа ойртоорой (3 метр дотор).":"Хамтрагч тань одоогоор энд алга.");return}
    if(myReq){toast("Хариу хүлээж байна…");return}if(me.sit&&k!=="hand")standUp();myReq={k,to:o.peer,id:uid(),t:performance.now()};pres({rq:{k,to:o.peer,id:myReq.id}});toast(o.name+"-д "+ACT_TXT[k]+" хүсэлт илгээлээ.")}}
function showReq(){if(!incoming)return;$("reqTxt").textContent=incoming.name+(incoming.k==="hand"?" тантай хөтлөлцөхийг хүсэж байна.":incoming.k==="kiss"?" таныг үнсэхийг хүсэж байна.":" таныг тэврэхийг хүсэж байна.");$("req").hidden=false}
$("reqYes").onclick=()=>{if(!incoming)return;const r=incoming;incoming=null;$("req").hidden=true;handledReq.add(r.id);if(me.sit&&r.k!=="hand")standUp();if(myLink)endLink(true);
  myLink={k:r.k,w:r.from,id:r.id,lead:false,t:performance.now()};pres({ac:{id:r.id,ok:true},lk:{k:r.k,w:r.from,id:r.id}});startLinkFx()};
$("reqNo").onclick=()=>{if(!incoming)return;handledReq.add(incoming.id);pres({ac:{id:incoming.id,ok:false}});incoming=null;$("req").hidden=true};
function startLinkFx(){const kiss=myLink&&myLink.k==="kiss";for(let i=0;i<(kiss?7:3);i++)setTimeout(()=>floatEmoji(kiss&&i%2?"💋":"❤️",me.x+(Math.random()-.5)*.6,2.1,me.z+(Math.random()-.5)*.6),i*250);toast(kiss?"Үнсэлт 💋":myLink&&myLink.k==="hug"?"Тэврэлт ♥":"Хөтлөлцөж байна ♥ "+(myLink&&myLink.lead?"Та хөтөлж алхана.":"Хамтрагч тань хөтөлж алхана."))}
function endLink(silent){if(!myLink)return;myLink=null;pres({lk:null});if(!silent)toast("Салсан.",1500)}
function checkLink(now){if(!myLink)return;const o=others.get(myLink.w),age=now-myLink.t;
  const ok=o&&o.lk&&o.lk.id===myLink.id;if(!o||(o.lk&&o.lk.id!==myLink.id)||(!ok&&age>5000)||((myLink.k==="hug"||myLink.k==="kiss")&&age>6500)){endLink(true)}}
let actKey="";
function updActions(){const acts=[];
  if(me.sit)acts.push(["sit","Босох","E"]);else if(!(myLink&&!myLink.lead&&myLink.k!=="hand")&&freeSeat())acts.push(["sit","Суух","E"]);

  musicOn=true;$("musicBtn").setAttribute("aria-pressed","true");const scale=[261.6,293.7,329.6,392,440,523.3,587.3,659.3];
  const tick=()=>{if(!musicOn)return;const t=actx.currentTime;[0,1].forEach(k=>{if(k&&Math.random()<.5)return;const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=scale[Math.random()*scale.length|0]*(k?.5:1);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.04);g.gain.exponentialRampToValueAtTime(.001,t+2.6);o.connect(g);g.connect(master);o.start(t);o.stop(t+2.7)});musicT=setTimeout(tick,700+Math.random()*900)};tick()}
